<main class="hero">

  </h1>

  <!-- ---- Comparador de imagenes ---- -->
  <figure class="compare-wrap">

    <!-- etiquetas fuera del marco de las imagenes -->
    <div class="legend">
      <span class="legend__item legend__item--left">Soluciones</span>
      <span class="legend__item legend__item--right">Productos</span>
    </div>

    <div class="compare" id="compare" style="--pos:50%">
      <img class="compare__img" src="IMG2.png" alt="Productos" draggable="false">
      <div class="compare__clip">
        <img class="compare__img" src="IMG1.png" alt="Soluciones" draggable="false">
      </div>

      <div class="compare__divider" aria-hidden="true"></div>
      <button type="button" class="compare__handle" id="compareHandle"
              role="slider" aria-label="Comparar soluciones y productos"
              aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" aria-orientation="horizontal">
